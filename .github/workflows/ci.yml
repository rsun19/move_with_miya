name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix user-service
          npm ci --prefix classes-service
          npm ci --prefix registration-service
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          (cd user-service && npx prisma generate)
          (cd classes-service && npx prisma generate)
          (cd registration-service && npx prisma generate)

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run lint
      - run: npx prettier --check .
  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run build --prefix backend
      - run: npm run build --prefix user-service
      - run: npm run build --prefix classes-service
      - run: npm run build --prefix registration-service
      - run: npm run build --prefix frontend

  migrations:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      # Applies every migration to an empty database, then fails if the
      # Prisma schema (including partial indexes) differs from the result.
      - name: Apply migrations and check for schema drift
        run: |
          for service in user-service classes-service registration-service; do
            export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${service//-/_}"
            (cd "$service" \
              && npx prisma migrate deploy \
              && npx prisma migrate diff --from-config-datasource \
                --to-schema prisma/schema.prisma --exit-code)
          done

  test:
    needs: install
    runs-on: ubuntu-latest
    env:
      CONTACT_E2E_USE_REAL_REDIS: 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm test
      - run: npm run test:e2e --prefix backend

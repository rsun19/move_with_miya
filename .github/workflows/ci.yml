name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix user-service
          npm ci --prefix classes-service
          npm ci --prefix registration-service
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          (cd user-service && npx prisma generate)
          (cd classes-service && npx prisma generate)
          (cd registration-service && npx prisma generate)

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run lint
      - run: npx prettier --check .

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm run build --prefix backend
      - run: npm run build --prefix user-service
      - run: npm run build --prefix classes-service
      - run: npm run build --prefix registration-service
      - run: npm run build --prefix frontend

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/src/generated
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', '**/prisma/schema.prisma') }}
      - run: npm test

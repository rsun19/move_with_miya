name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install root dependencies
        run: npm ci

      - name: Install sub-project dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix user-service
          npm ci --prefix classes-service
          npm ci --prefix registration-service

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: |
          npm run build --prefix backend
          npm run build --prefix user-service
          npm run build --prefix classes-service
          npm run build --prefix registration-service
          npm run build --prefix frontend

      - name: Test
        run: npm test
